# Streamlit theme + server settings for the TBML review dashboard.
# Dashboard-specific visual tokens live in dashboard/config/dashboard_theme.yml.

# Core values mirror dashboard/config/dashboard_theme.yml. The sidebar and
# component details are applied centrally by dashboard/components/styles.py.
[theme]
base = "light"
primaryColor = "#0F8F8F"          # teal accent (widgets, slider, queue score bars)
# backgroundColor drives the st.dataframe (glide) header fill, which the
# dataframeHeaderBackgroundColor option does not honour in this Streamlit build.
# Set to white so the Top 50 Review Queue header matches its white cells; the
# visual page plane (page_bg #F3F6FA) is painted separately by styles.py CSS.
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"  # white cards + widget/input fills
textColor = "#22314A"             # navy ink
font = "sans-serif"

[server]
headless = true

[browser]
gatherUsageStats = false
