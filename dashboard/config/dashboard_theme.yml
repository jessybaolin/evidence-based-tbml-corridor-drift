# Canonical runtime visual tokens for the TBML review dashboard.
# Pages supply content and data only; shared components own presentation.

palette:
  ink: "#22314A"
  muted: "#637087"
  page_bg: "#F3F6FA"
  panel_bg: "#FFFFFF"
  border: "#D5DFEA"
  accent: "#0F8F8F"
  accent_soft: "#DDF4F1"
  teal_500: "#29B3AA"
  teal_hover: "#0B7777"
  ledger_ink: "#5A6B84"
  navy_700: "#334966"
  sidebar_bg: "#1D2D46"
  sidebar_ink: "#F8FAFD"
  sidebar_muted: "#9FB0C8"
  sidebar_sel_bg: "#29405E"
  sidebar_hover_bg: "#243854"
  table_stripe: "#EFF3F8"
  amber: "#F2B544"
  amber_soft: "#FFF3D8"
  selected_bg: "#FFF3D8"
  selected_accent: "#F2B544"
  card_shadow: "rgba(29,45,70,0.08)"
  btn_secondary_border: "#7E8DA4"

typography:
  family: '"Source Sans Pro", "Source Sans 3", "Segoe UI", sans-serif'
  mono_family: '"SFMono-Regular", Consolas, "Liberation Mono", monospace'
  page_title_px: 38
  section_title_px: 20
  body_px: 15
  small_px: 13
  line_height: 1.5

spacing:
  xs: 4
  sm: 8
  md: 12
  lg: 16
  xl: 24
  xxl: 32
  section: 28

layout:
  max_width_px: 1280
  desktop_padding_px: 32
  narrow_padding_px: 18
  footer_clearance_px: 104

surfaces:
  border_width_px: 1
  radius_px: 8
  radius_large_px: 10
  shadow: "0 8px 22px rgba(29,45,70,0.08)"
  shadow_hover: "0 10px 26px rgba(29,45,70,0.12)"

components:
  page:
    max_width_px: 1280
    desktop_padding_px: 32
    narrow_padding_px: 18
  card:
    padding_px: 18
    min_height_px: 0
  kpi:
    accent: "#0F8F8F"
    icon_bg: "#DDF4F1"
    icon_color: "#0F8F8F"
    icon_size_px: 46
    min_height_px: 152
  banner:
    min_height_px: 74
    padding_y_px: 16
    padding_x_px: 18
  icon:
    size_px: 20
    badge_size_px: 46
    stroke_width: 1.8
  button:
    height_px: 40
    radius_px: 7
    secondary_border: "#7E8DA4"
  filters:
    padding_px: 16
    gap_px: 12
  table:
    row_height_px: 38
    header_bg: "#F3F6FA"
    stripe_bg: "#EFF3F8"
  footer:
    min_height_px: 58

source_roles:
  official:
    accent: "#4078C0"
    text: "#2C5F9E"
    soft: "#EAF2FB"
    icon: "landmark"
  benchmark:
    accent: "#0F8F8F"
    text: "#0B7777"
    soft: "#DDF4F1"
    icon: "line-chart"
  typology:
    accent: "#D89A2B"
    text: "#6E4E12"
    soft: "#FFF3D8"
    icon: "file-search"

selection:
  background: "#FFF3D8"
  border: "#F2B544"
  text: "#22314A"

boundary:
  bg: "#1D2D46"
  border: "#16233A"
  accent: "#29B3AA"
  ink: "#F8FAFD"
  label: "#DDF4F1"

mental_model:
  bg: "#223753"
  accent: "#29B3AA"
  ink: "#F8FAFD"
  icon_bg: "rgba(41,179,170,0.16)"

evaluation:
  tint: "#FFF3D8"
  border: "#D89A2B"
  label_ink: "#6E4E12"
  receded_opacity: 0.90

families:
  crude_palm_oil: "#4D9B70"
  refined_copper_cathodes: "#B15C2E"
  gold_unwrought: "#D4A72C"

status:
  fallback: {color: "#5C6B7E", label: "Unknown"}
  quality:
    fully_usable: {color: "#2F9B78", label: "Fully usable"}
    usable_with_caveat: {color: "#D89A2B", label: "Usable with caveat"}
    excluded_from_modeling_retained_for_audit: {color: "#5C6B7E", label: "Audit only (not modelled)"}
    excluded_entirely: {color: "#5C6B7E", label: "Excluded"}
  severity:
    high: {color: "#C65D63", label: "High"}
    medium: {color: "#D89A2B", label: "Medium"}
    low: {color: "#8A6D1D", label: "Low"}

chart:
  font_family: '"Source Sans Pro", "Source Sans 3", "Segoe UI", sans-serif'
  grid_color: "#E5E9F0"
  axis_color: "#C2CBDA"
  context_gray: "#97A3B4"
  emphasis: "#0F8F8F"
  # Selected Case Review comparison views: a warm maroon emphasis line for the
  # corridor itself, cool blue/violet reference lines, and a soft slate (not flat
  # grey) for the peer population. Harmonises with Navy + Teal + Warm Amber; the
  # amber case-diamond stays the "selected" marker on top.
  case_corridor: "#A62E4E"
  case_benchmark: "#5E7CB0"
  case_prior: "#7C5CA6"
  peer_bars: "#9DB0CE"
  marker_outline: "#FFFFFF"
  # Gold-coverage persistent-gap network: calm red/blue direction hues (a steel
  # blue for Netherlands-outbound, a muted brick red for inbound), a light
  # neutral for non-Netherlands routes, a muted slate node with a dark navy hub
  # so the 12-route centre reads by colour as well as size.
  network_outbound: "#4E79A8"
  network_inbound: "#C0504D"
  network_other: "#B7BFCB"
  network_node: "#5B6E8C"
  network_hub: "#1D2D46"
  transparent: "rgba(0,0,0,0)"
  height: 360
  height_tall: 440
  margin: {l: 10, r: 10, t: 24, b: 10}

motion:
  fast_ms: 120
  standard_ms: 180
  landing_entry_ms: 260
  landing_stagger_ms: 45
  welcome_entry_ms: 820
  welcome_stagger_ms: 175
  dashboard_entry_ms: 520
  dashboard_entry_delay_ms: 340
  dashboard_sidebar_ms: 960
  business_reveal_ms: 720
  easing: "cubic-bezier(0.22, 1, 0.36, 1)"
  entry_ms: 350
  entry_step_ms: 70
  hover_ms: 180
  scene_step_ms: 120
  travel_ms: 600
  hover_lift_px: 2

breakpoints:
  narrow_px: 768
  sidebar_px: 992
