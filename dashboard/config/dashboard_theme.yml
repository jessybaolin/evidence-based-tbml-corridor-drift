# Visual tokens for the TBML review dashboard.
# Change colours, chart defaults, and status styling here — pages read these
# tokens through services.data_loader.load_theme(); nothing is hardcoded per page.
#
# Identity: "deep blue" — a cool blue plane under Storm-navy ink, near-white
# cards that lift off the plane, a deep-navy sidebar frame, one Steel slate-blue
# accent, frost hairlines, and an amber boundary stamp. Blue is the dominant hue
# by surface area (plane + navy sidebar + navy headings); white cards and the
# single amber caveat are the only non-blue notes. Moonlight cream is retired as
# the plane — it read as "beige" — and no longer appears in the active palette.
# Palette reference (transcribed): Moonlight #F0ECDD, Frost Blue #8BA3C5,
# Steel #495B7D, Storm #23354D, Oxford Blue #02122F.

palette:
  ink: "#23354D"          # primary text — Storm navy (8.8:1 on the blue plane)
  muted: "#505D76"        # secondary text — deepened steel-gray (4.7:1 on plane)
  page_bg: "#CFDAE8"      # app plane — cool Frost-derived BLUE (the dominant hue)
  panel_bg: "#F8FBFE"     # cards / chart surface — cool near-white, lifts 1.36:1
  border: "#B9C8DE"       # hairline borders — bluer frost tint (visible on plane)
  accent: "#495B7D"       # Steel — links, eyebrows, selected states, ledger rule
  accent_soft: "#DCE5F2"  # light steel-blue wash — step-pill / soft fills
  ledger_ink: "#3E4E68"   # provenance ledger lines (mono-set source captions)
  sidebar_bg: "#23354D"   # deep Storm navy — anchors the darkest blue in the frame
  sidebar_ink: "#EAF0F8"  # frost near-white — sidebar brand + nav text on navy
  sidebar_muted: "#B7C6DE" # frost caption on navy (7.2:1)
  table_stripe: "#EFF3FA"  # faint cool zebra tint for st.dataframe odd rows
                           # (sits between panel_bg #F8FBFE and the plane; via Styler)

# Steel is the single brand accent: links, eyebrows, selected states, the
# provenance ledger rule, and the emphasis series. Frost Blue (#8BA3C5) is too
# light for text/accent on a light surface, so the accent is Steel #495B7D
# (6.6:1 on white cards, 4.8:1 on the blue plane). The deepest navies (Storm,
# Oxford) live in the sidebar and headings so the darkest blues are present,
# not implied only by the ink colour.

# The boundary banner is a discipline, not an alarm — but it must catch the
# reader's eye on every page. A FILLED Steel card with near-white text and a
# bright Frost-Blue edge: prominent like a real callout, on-theme (blue, never
# yellow). Verified: body text #F8FBFE on Steel #495B7D = 6.8:1 (AA).
boundary:
  bg: "#495B7D"           # Steel fill — prominent, on-theme
  border: "#3E5170"       # slightly darker steel edge
  accent: "#8BA3C5"       # Frost Blue left rule (bright edge on the fill)
  ink: "#F8FBFE"          # near-white body text (6.8:1 on the fill)
  label: "#DCE7F5"        # frost uppercase label

# Categorical series colours for the three HS6 product families.
# Kept as the validated reference trio — a nominal (identity) scale must stay
# clearly separable hues, never a monochrome blue ramp. Verified (OKLab dE x100,
# Machado 1.0): worst pair copper-vs-gold protanopia = 9.1 (>= 8 CVD floor),
# min normal-vision dE = 22.9. Colour follows the entity on every page/filter.
families:
  crude_palm_oil: "#2A78D6"          # blue
  refined_copper_cathodes: "#1BAF7A" # aqua
  gold_unwrought: "#EDA100"          # yellow

# Evaluation-lane state: the ONLY warm surface in the app, reserved for the
# "controlled evaluation copy" (synthetic-scenario) lane on the methodology
# page. Semantic non-production state — always paired with an explicit text
# label, never colour alone. Verified WCAG (Python): label 6.45:1 and ink
# 10.56:1 on the tint; at the receded state (element opacity 0.90 composited
# over the blue plane) label 5.20:1 / ink 8.02:1 / muted 4.54:1 — all AA.
evaluation:
  tint: "#F3ECDA"        # desaturated amber wash — quiet, clearly non-blue
  border: "#C2AA74"      # dashed lane boundary
  label_ink: "#6E4E12"   # ochre label text (matches status ochre family)
  receded_opacity: 0.90  # end-state emphasis after the selected model returns

# Status colours are reserved for state and always rendered with a text label,
# never as colour alone (aqua/yellow-family tones are sub-3:1 on white).
status:
  quality:
    fully_usable: {color: "#0A7D0A", label: "Fully usable"}
    usable_with_caveat: {color: "#8A6D1D", label: "Usable with caveat"}
    excluded_from_modeling_retained_for_audit: {color: "#5C6B7E", label: "Audit only (not modelled)"}
    excluded_entirely: {color: "#5C6B7E", label: "Excluded"}
  severity:
    high: {color: "#C23A3A", label: "High"}
    medium: {color: "#C0622F", label: "Medium"}
    low: {color: "#8A6D1D", label: "Low"}

# Motion: restrained and compositor-friendly (opacity/transform only). One
# fade-up entrance for page sections, one hover lift for cards/tiles/links.
# components/styles.py disables ALL of it under prefers-reduced-motion.
motion:
  entry_ms: 350        # section fade-up duration on page entry
  entry_step_ms: 70    # stagger between successive sections
  hover_ms: 180        # card/tile/link hover transition
  scene_step_ms: 120   # storyboard-beat stagger inside a methodology scene
  travel_ms: 600       # the one "selected model returns" chip travel (scene 3)

chart:
  font_family: '"Source Sans Pro", "Source Sans 3", "Segoe UI", sans-serif'
  grid_color: "#E5E9F0"    # hairline, solid — never dashed
  axis_color: "#C2CBDA"
  context_gray: "#97A3B4"  # de-emphasised context series (e.g. benchmark line)
  emphasis: "#495B7D"      # the one highlighted series — Steel accent (dE 24 vs context)
  height: 360
  height_tall: 440
  margin: {l: 10, r: 10, t: 24, b: 10}
