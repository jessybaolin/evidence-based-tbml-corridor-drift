      unit:
        heading: "What does one row represent?"
        equation: "1 calendar year × 1 exporter × 1 importer × 1 HS6 product = 1 corridor-product-year observation"
        year_label: "Calendar year {year}"
        row_label: "One annual aggregated row"
        exporter_label: "Exporter"
        importer_label: "Importer"
