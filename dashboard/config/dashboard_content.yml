    closing:
      statement: "The data is now clean, comparable and time-safe — ready to read. Every figure traces back to verified public trade and benchmark records at one annual grain: one exporter, one importer, one product, one year. From here, each pattern the queue flags is measured against this prepared picture — how large the trade is, how its corridors are built, and how far its price moved on its own — so a case reads as genuinely unusual rather than merely large. Each one is carried forward with recomputable evidence and clear caveats, and every conclusion is left to accountable human review."
