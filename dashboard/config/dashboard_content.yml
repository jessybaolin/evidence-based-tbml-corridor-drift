# Stakeholder-facing copy for the TBML review dashboard.
# Edit wording here — page titles, subtitles, KPI labels, captions, limitation
# bullets. Pages read this file through services.data_loader.load_content().
#
# The conclusion boundary itself is NOT here: it is loaded verbatim from
# configs/project.yml (key `conclusion_boundary`) so the dashboard can never
# drift from the pipeline's approved wording.

app:
  title: "Evidence-First TBML Triage System"
  short_title: "TBML Triage System"
  subtitle: "Turns official public trade data into a ranked queue of unusual corridor–product–year patterns for human review."
  icon: "🔎"

boundary_label: "Human-review boundary"

# Short display names for the three HS6 product families.
family_short_labels:
  crude_palm_oil: "Palm oil"
  refined_copper_cathodes: "Copper"
  gold_unwrought: "Gold"

# Display names for the evidence checks in data/outputs/evidence_table.csv
# (evidence_type values). The set shown is always derived from the file itself;
# unknown types fall back to a humanised key.
evidence_type_labels:
  history_deviation: "History deviation"
  annual_unit_value_change: "Annual unit-value change"
  benchmark_adjusted_drift: "Benchmark-adjusted drift"
  benchmark_gap: "Benchmark gap"
  value_quantity_divergence: "Value–quantity divergence"

pages:
  executive_overview:
    eyebrow: "Business Problem & Value"
    title: "Evidence-Backed Trade Pattern Triage"
    subtitle: "Helping AFC analysts decide which unusual trade patterns to review first—and why."
    problem_heading: "The business problem"
    problem_body: >
      Trade-based money laundering can exploit the price, quantity, or
      description of traded goods. However, trade volumes are large, market
      prices are difficult to assess, and no single institution sees the
      complete transaction chain.
    problem_body_2: >
      For AFC teams, the immediate challenge is therefore prioritisation:
      which patterns deserve limited analyst time? An unexplained anomaly
      score is not enough because the analyst must first reconstruct why the
      alert exists before reviewing it.
    challenge_card:
      label: "The challenge"
      bullets:
        - "Far too many trade flows to review manually."
        - "Analyst capacity is limited and expensive."
        - "Opaque alerts create more work before review can even begin."
    response_card:
      label: "The project response"
      bullets:
        - "Rank unusual patterns so review starts where signals are strongest."
        - "Explain every ranking with recomputable evidence."
        - "Attach caveats and the next review questions to each case."
    what_heading: "What this project does"
    # {observations}, {year_start}, {year_end}, {n_commodities} are derived
    # live from the pipeline outputs on the page — never typed in here.
    what_body: >
      This public-data prototype analyses {observations} annual trade
      observations from {year_start}–{year_end} across {n_commodities}
      deliberately different commodities:
    what_body_2: >
      It ranks {corridor_term} patterns using a combination of transparent
      rules and machine learning, then attaches the evidence, caveats, and
      possible benign explanations behind each ranking.
    corridor_term: "exporter–importer–product–year"
    tooltip_corridor: "One exporter, one importer, one product and one calendar year, aggregated from public trade records."
    deliverables_heading: "What stakeholders receive"
    deliverables:
      observations:
        label: "observations"
        detail: "Screened systematically rather than reviewed manually."
      queue:
        label: "review queue"
        detail: "The most unusual patterns are brought to the front."
      evidence:
        label: "evidence points per case"
        detail: "Each ranking is supported by recomputable facts."
      briefs:
        label: "caveated analyst briefs"
        detail: "The highest-ranked cases explain what changed, what may be benign, what information is missing, and what to verify next."
    # {evidence_per_case}, {n_types} and {evidence_types} are derived from
    # data/outputs/evidence_table.csv on the page.
    tooltip_evidence: "Each case carries {evidence_per_case} recomputable evidence rows, drawn from {n_types} checks: {evidence_types}."
    queue_cta: "Open the Top 50 Review Queue"
    pipeline_heading: "How the queue is built"
    pipeline_steps: ["Public data", "Unusual-pattern scoring", "Evidence", "Human review"]
    pipeline_cta: "Full methodology story"
    why_heading: "Why it matters"
    quote_before_label: "The analyst's starting question — today"
    quote_before: "Why does this alert exist?"
    quote_after_label: "With this project"
    quote_after: "Which of these clearly stated facts should I verify first?"
    why_body: >
      For a wholesale bank, it demonstrates how public trade information could
      act as an external intelligence layer—adding corridor and commodity
      context to trade-finance reviews while preserving human judgement and
      existing AFC controls.
    bottom_line: >
      This project converts {observations} public trade observations into an
      explainable queue of {queue_size} unusual patterns, helping AFC analysts
      focus their review effort without treating an anomaly as evidence of
      financial crime.
    value_chips: ["Faster triage", "Consistent review", "Defensible evidence"]
  review_queue:
    eyebrow: "Stakeholder analytics"
    title: "Top 50 Review Queue"
    subtitle: "The top-ranked official observations — filter the queue, pick the current case, and export the view."
    caveat: "A high rank means the row shows unusual analytical signals; it is not a finding of wrongdoing."
    filters_heading: "Filters"
    filters_caption: "Year, product family, exporter and importer scope the queue below; empty filters mean no restriction."
    queue_size_label: "Queue size"
    queue_size_options: ["Top 50", "Top 500"]
    queue_size_note: "The analytical pipeline currently publishes the top {published} ranked observations, so both queue sizes show the same {published} rows."
    advanced_label: "Advanced filters"
    reset_label: "Reset filters"
    results_heading: "Ranked official observations"
    results_caption: "{shown} of {total} review candidates match the current filters. Select a row to make it the current case."
    empty_message: "No review candidates match the current filters. Adjust the year, product family, exporter or importer selections, or widen the score range under Advanced filters."
    export_label: "Export current view (.csv)"
    export_help: "Downloads the rows currently shown, ordered by rank, with full-precision values and the observation ID for traceability."
    banner_default: "Default case #{rank}: {year} {exporter} → {importer} — {product}. Select another row to change it."
    banner_current: "Current case #{rank}: {year} {exporter} → {importer} — {product}."
    open_case_label: "Open case review"
    # The score explainer is shown verbatim in the score column tooltip AND in
    # the note under the table (single YAML anchor so the two can never drift).
    score_note: &queue_score_note "The score combines several unusual-pattern signals to determine which observations should be reviewed first. A higher score means higher review priority—it is not the probability or a finding of financial crime."
    table_caption_products: "Products: {mappings}."
    table_caption_precision: "On-screen numbers are rounded for reading. The CSV export keeps full precision and is always ordered by rank — in-app column sorting reorders the view only, never the export."
    columns:
      rank:
        label: "Rank"
        help: "Queue position — 1 is the most unusual official observation. Rows keep their rank when the table is re-sorted."
      year:
        label: "Year"
        help: "Calendar year of the annual official observation."
      corridor:
        label: "Corridor"
        help: "Exporter → importer as the official three-letter codes (e.g. GBR → ITA); grouped partners keep their source code (e.g. S19 = Other Asia, nes). Full names appear in the case banner above and on Selected Case Review."
      product:
        label: "Product"
        help: "Product family. {mappings}. Per-observation data-quality caveats appear on Selected Case Review."
      trade_value_usd:
        label: "Trade value (USD)"
        help: "Annual aggregate trade value reported for this corridor-product-year, in US dollars."
      quantity_metric_ton:
        label: "Quantity (metric tons)"
        help: "Annual aggregate quantity in metric tons. Gold flows can be small fractions of a ton."
      unit_value_usd_per_metric_ton:
        label: "Unit value (USD/t)"
        help: "Implied aggregate unit value — trade value divided by quantity. An annual aggregate, not an invoice price."
      benchmark_price_usd_per_metric_ton:
        label: "Benchmark price (USD/t)"
        help: "World Bank benchmark price for the same year — broad market context, not invoice-level fair value."
      selected_review_priority_score:
        label: "Review-priority score"
        help: *queue_score_note
  case_investigation:
    eyebrow: "Stakeholder analytics"
    title: "Selected Case Review"
    subtitle: "Understand why this official trade observation ranked highly by comparing it with the market, its own history and comparable trade corridors."
    caveat: "The implied unit value is an annual aggregate, not an invoice price."
    tabs: ["Case Summary", "Why It Ranked High", "Limitations"]
    selector_label: "Change case"
    selector_help: "Pick a case here, or select a row on the Review Queue page."
    not_in_queue: "The selected observation is not in the review queue. Choose another case."
    # Runtime consistency gate: if any recomputed value disagrees with the
    # published artefacts the page shows this message INSTEAD of numbers.
    validation_error: >-
      This case is not displayed because a consistency check between the
      published review queue, the feature table and the official clean panel
      failed: {reason}. No values are shown rather than risking an incorrect
      number. Re-run the analytical pipeline and reload the dashboard.
    strip:
      score_label: "Review-priority score"
      score_tip: "This score determines review order. A higher score means higher review priority; it is not a probability or finding of financial crime."
      quality_label: "Data quality"
      quality_tip: "Data quality rates how usable the underlying official record is. It is separate from how unusual the observation is."
    facts:
      heading: "Case facts"
      caption: "Annual official aggregates — not invoices or shipments."
      rank: "Review rank"
      year: "Year"
      corridor: "Corridor"
      product: "Product"
