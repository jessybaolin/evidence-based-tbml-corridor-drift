# Verbatim from reports/final_analysis_report.md — Key limitations.
limitations:
  - "The data is yearly, country-to-country totals — not individual invoices, shipments, customers, payments, or company ownership."
  - "The world-price benchmark is broad market context, not a fair price for any single deal."
  - "Test scenarios are used only to check the method; they are never treated as real cases."
  - "Typology references (FATF–Egmont) add context and caveats only — never evidence or proof."
  - "A score sets the review order. It is not a probability, and not a legal finding."

interpretation_language:
  allowed:
    - "This observation ranks highly for human review because several aggregate trade signals are unusual."
    - "The evidence table shows which recomputable metrics supported the ranking."
  not_allowed:
    - "The model detected money laundering."
    - "The World Bank benchmark proves that an invoice was mispriced."

