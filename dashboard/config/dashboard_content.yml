# Stakeholder-facing copy for the TBML review dashboard.
# Edit wording here — page titles, subtitles, KPI labels, captions, limitation
# bullets. Pages read this file through services.data_loader.load_content().
#
# The conclusion boundary itself is NOT here: it is loaded verbatim from
# configs/project.yml (key `conclusion_boundary`) so the dashboard can never
# drift from the pipeline's approved wording.

app:
  title: "Evidence-First TBML Triage System"
  short_title: "TBML Triage System"
  subtitle: "Turns official public trade data into a ranked queue of unusual corridor–product–year patterns for human review."
  # Short sidebar descriptor. The full `subtitle` sentence is the landing hero's
  # value line; the persistent sidebar carries only this compact tag so the nav
  # stays scannable (and deep-linkers who skip the landing still get context).
  tagline: "Review-priority analytics"
  icon: "🔎"

# Full-screen welcome (landing) copy. The hero title spells the acronym out in
# full — the compact "Evidence-First TBML Triage System" stays the sidebar
# brand. title_lines are rendered as separate hero lines (semantic phrases), so
# the break points are controlled here, not by the CSS.
landing:
  eyebrow: "Review-priority analytics"
  title_lines:
    - "Evidence-First"
    - "Trade-Based Money Laundering (TBML)"
    - "Triage System"
  cta: "Enter the dashboard"
  # Decorative top-bar labels (text only — routing is unchanged; the real Home
  # control is the sidebar house icon on dashboard pages). First item is active.
  nav:
    - "Home"
    - "Methodology"
    - "Review queue"
  # "How it works" connected pipeline — three nodes, public data to human call.
  pipeline:
    - step: "Step 01"
      title: "Public trade data"
      body: "Official country-to-country product totals, compared against broad market prices."
    - step: "Step 02"
      title: "Ranked queue"
      body: "The strongest unusual corridor–product–year patterns rise to the top."
    - step: "Step 03"
      title: "Human review"
      body: "An analyst reads the evidence behind each case and makes the call."
  scroll_cue: "See the product"
  product_caption: "Live product · Top 50 Review Queue"
  product_url: "tbml-triage.app / top-50-review-queue"

boundary_label: "Human-review boundary"

# Creator / "about" block pinned to the foot of the sidebar. section_label is the
# nav-group heading; the GitHub link is the real project repo, the rest are
# PLACEHOLDERS to be replaced with the creator's own details. A blank link is
# simply not rendered.
about:
  section_label: "Behind the Project"
  name: "Jesslyn Guo Baolin"
  bio: "Creator of this project"
  links:
    linkedin: "https://www.linkedin.com/in/jesslyn-baolin/"
    github: "https://github.com/jessybaolin/evidence-based-tbml-corridor-drift"
    email: "jessbaolin@gmail.com"

# Short display names for the three HS6 product families.
family_short_labels:
  crude_palm_oil: "Palm oil"
  refined_copper_cathodes: "Copper"
  gold_unwrought: "Gold"

# Display names for the evidence checks in data/outputs/evidence_table.csv
# (evidence_type values). The set shown is always derived from the file itself;
# unknown types fall back to a humanised key.
evidence_type_labels:
  history_deviation: "History deviation"
  annual_unit_value_change: "Annual unit-value change"
  benchmark_adjusted_drift: "Benchmark-adjusted drift"
  benchmark_gap: "Benchmark gap"
  value_quantity_divergence: "Value–quantity divergence"

pages:
  executive_overview:
    eyebrow: ""
    title: "Evidence-First Trade Pattern Triage"
    subtitle: "Helping AFC analysts decide which unusual trade patterns to review first—and why."
    problem_heading: "The business problem"
    problem_body: >
      Trade-based money laundering can exploit the price, quantity, or
      description of traded goods. However, trade volumes are large, market
      prices are difficult to assess, and no single institution sees the
      complete transaction chain.
    problem_body_2: >
      For AFC teams, the immediate challenge is therefore prioritisation:
      which patterns deserve limited analyst time? An unexplained anomaly
      score is not enough because the analyst must first reconstruct why the
      alert exists before reviewing it.
    challenge_card:
      label: "The challenge"
      bullets:
        - "Far too many trade flows to review manually."
        - "Analyst capacity is limited and expensive."
        - "Opaque alerts create more work before review can even begin."
    response_card:
      label: "The project response"
      bullets:
        - "Rank unusual patterns so review starts where signals are strongest."
        - "Explain every ranking with recomputable evidence."
        - "Attach caveats and the next review questions to each case."
    what_heading: "What this project does"
    # {observations}, {year_start}, {year_end}, {n_commodities} are derived
    # live from the pipeline outputs on the page — never typed in here.
    what_body: >
      This public-data prototype analyses {observations} annual trade
      observations from {year_start}–{year_end} across {n_commodities}
      deliberately different commodities:
    what_body_2: >
      It ranks {corridor_term} patterns using a combination of transparent
      rules and machine learning, then attaches the evidence, caveats, and
      possible benign explanations behind each ranking.
    corridor_term: "exporter–importer–product–year"
    tooltip_corridor: "One exporter, one importer, one product and one calendar year, aggregated from public trade records."
    commodity_info:
      crude_palm_oil: "Oil pressed from oil-palm fruit. It is widely used in cooking oil, packaged food, soap, cosmetics and biofuel."
      refined_copper_cathodes: "High-purity copper made during refining. It is used for electrical wiring, electronics, motors, plumbing and construction."
      gold_unwrought: "This project covers only HS6 710812: non-monetary gold in unwrought forms other than powder, such as bars or ingots. It excludes non-monetary gold powder (710811), semi-manufactured gold (710813) and monetary gold (710820). This gold may be held for investment or processed into jewellery, electronics and industrial components."
    deliverables_heading: "What the system delivers"
    deliverables:
      observations:
        label: "observations"
        detail: "Screened systematically rather than reviewed manually."
      queue:
        label: "review queue"
        detail: "The most unusual patterns are brought to the front."
      evidence:
        label: "evidence checks per case"
        detail: "Each ranking is supported by recomputable facts."
      briefs:
        label: "caveated analyst briefs"
        detail: "The highest-ranked cases explain what changed, what may be benign, what information is missing, and what to verify next."
    # {evidence_per_case}, {n_types} and {evidence_types} are derived from
    # data/outputs/evidence_table.csv on the page.
    tooltip_evidence: "Each case carries {evidence_per_case} recomputable evidence rows, drawn from {n_types} checks: {evidence_types}."
    queue_cta: "Open the Top 50 Review Queue"
    pipeline_heading: "How the queue is built"
    pipeline_steps: ["Public data", "Unusual-pattern scoring", "Evidence", "Human review"]
    pipeline_cta: "Full methodology story"
    why_heading: "Why it matters"
    quote_before_label: "The analyst's starting question — today"
    quote_before: "Why does this alert exist?"
    quote_after_label: "With this project"
    quote_after: "Which of these clearly stated facts should I verify first?"
    why_body: >
      For a wholesale bank, it demonstrates how public trade information could
      act as an external intelligence layer—adding corridor and commodity
      context to trade-finance reviews while preserving human judgement and
      existing AFC controls.
    bottom_line: >
      This project converts {observations} public trade observations into an
      explainable queue of {queue_size} unusual patterns, helping AFC analysts
      focus their review effort without treating an anomaly as evidence of
      financial crime.
    value_chips: ["Faster triage", "Consistent review", "Defensible evidence"]
  review_queue:
    eyebrow: "Stakeholder analytics"
    title: "Top 50 Review Queue"
    subtitle: "The top-ranked official observations — filter the queue, pick the current case, and export the view."
    caveat: "A high rank means the row shows unusual analytical signals; it is not a finding of wrongdoing."
    filters_heading: "Filters"
    reset_label: "Reset filters"
    results_heading: "Ranked official observations"
    results_caption: "Select a row to make it the current case."
    empty_message: "No review candidates match the current filters. Adjust the year, product family, exporter or importer selections, or reset the filters."
    export_label: "Export current view (.csv)"
    export_help: "Downloads the rows currently shown, ordered by rank, with full-precision values and the observation ID for traceability."
    banner_default: "Default case #{rank}: {year} {exporter} → {importer} — {product}. Select another row to change it."
    banner_current: "Current case #{rank}: {year} {exporter} → {importer} — {product}."
    open_case_label: "Open case review"
    # The score explainer is shown verbatim in the score column tooltip AND in
    # the note under the table (single YAML anchor so the two can never drift).
    score_note: &queue_score_note "The score combines several unusual-pattern signals to determine which observations should be reviewed first. A higher score means higher review priority—it is not the probability or a finding of financial crime."
    table_caption_products: "Colored dots identify product families: {mappings}."
    table_caption_precision: "On-screen numbers are rounded for reading. The CSV export keeps full precision and is always ordered by rank — in-app column sorting reorders the view only, never the export."
    columns:
      rank:
        label: "Rank"
        help: "Queue position — 1 is the most unusual official observation. Rows keep their rank when the table is re-sorted."
      year:
        label: "Year"
        help: "Calendar year of the annual official observation."
      corridor:
        label: "Corridor"
        help: "Exporter → importer as the official three-letter codes (e.g. GBR → ITA); grouped partners keep their source code (e.g. S19 = Other Asia, nes). Full names appear in the case banner above and on Selected Case Review."
      product:
        label: "Product"
        help: "The colored dot identifies the product family. {mappings}. Per-observation data-quality caveats appear on Selected Case Review."
      trade_value_usd:
        label: "Trade value (USD)"
        help: "Annual aggregate trade value reported for this corridor-product-year, in US dollars."
      quantity_metric_ton:
        label: "Quantity (metric tons)"
        help: "Annual aggregate quantity in metric tons. Gold flows can be small fractions of a ton."
      unit_value_usd_per_metric_ton:
        label: "Unit value (USD/t)"
        # Shown as a footer note under the table (the in-grid tooltip landed far
        # from the header), so this text is the "How unit value is calculated" note.
        help: "Implied unit value is the annual trade value divided by the reported quantity in metric tons. It is called implied because it is calculated from aggregate public data, not observed from an invoice or transaction price."
      benchmark_price_usd_per_metric_ton:
        label: "Benchmark price (USD/t)"
        help: "World Bank benchmark price for the same year — broad market context, not invoice-level fair value."
      selected_review_priority_score:
        label: "Review-priority score"
        help: *queue_score_note
  case_investigation:
    eyebrow: "Stakeholder analytics"
    title: "Selected Case Review"
    subtitle: "Understand why this official trade observation ranked highly by comparing it with the market, its own history and comparable trade corridors."
    caveat: "The implied unit value is an annual aggregate, not an invoice price."
    tabs: ["Case Summary", "Why It Ranked High", "Caveats"]
    selector_label: "Change case"
    selector_help: "Pick a case here, or select a row on the Review Queue page."
    not_in_queue: "The selected observation is not in the review queue. Choose another case."
    # Definition surfaced on hover from the highlighted word "corridor" in each
    # comparison-view heading.
    corridor_tip: "A corridor is a single exporter→importer trade route — one exporter shipping to one importer. Combined with a product and a year, it is the unit this dashboard ranks and reviews."
    # Runtime consistency gate: if any recomputed value disagrees with the
    # published artefacts the page shows this message INSTEAD of numbers.
    validation_error: >-
      This case is not displayed because a consistency check between the
      published review queue, the feature table and the official clean panel
      failed: {reason}. No values are shown rather than risking an incorrect
      number. Re-run the analytical pipeline and reload the dashboard.
    strip:
      score_label: "Review-priority score"
      score_tip: "This score determines review order. A higher score means higher review priority; it is not a probability or finding of financial crime."
      quality_label: "Data quality"
      quality_tip: "Data quality rates how usable the underlying official record is. It is separate from how unusual the observation is."
    facts:
      heading: "Case facts"
      rank: "Review rank"
      year: "Year"
      corridor: "Corridor"
      product: "Product"
      trade_value: "Trade value"
      quantity: "Quantity"
      implied_uv: "Implied unit value"
      implied_uv_tip: "Annual reported trade value divided by reported quantity. It is an aggregate average, not an invoice price."
      benchmark: "World Bank benchmark price"
      vs_benchmark: "Unit value vs benchmark"
      vs_benchmark_value: "{multiple}× benchmark"
      quality: "Data quality"
      valid_extreme_note: "An extreme multiple (over 5× or under 0.2× the benchmark) that was checked and kept as a valid observation, not treated as a data error."
    views:
      selector_label: "Comparison view"
      labels: ["Market & history", "Peer position"]
      mode_label: "Display mode"
      mode_chart: "Chart"
      mode_table: "Table"
      combined:
        title: "How did the corridor compare with the market and its own history?"
        takeaway: "In {year}, the corridor's implied unit value was {market_multiple}× the annual World Bank benchmark and {history_multiple}× the median of its own {prior_years} earlier observed year(s)."
        takeaway_market_only: "In {year}, the corridor's implied unit value was {market_multiple}× the annual World Bank benchmark; there is no earlier observed year to compare it with."
        takeaway_unavailable: "A comparison is unavailable for the selected year because the implied unit value or the World Bank benchmark cannot be computed from the official record."
        note: "Two references on one view: the World Bank benchmark is the world market price; the prior corridor median summarises this corridor's own earlier observed years. Both are context, not invoice-level fair value. Unobserved years stay blank — never filled in or interpolated."
        series_corridor: "Corridor implied unit value"
        series_benchmark: "World Bank benchmark"
        series_prior: "Prior corridor median"
        y_title: "USD per metric ton"
        hover:
          trade_value: "Trade value"
          quantity: "Quantity"
          implied_uv: "Implied unit value"
          benchmark: "WB benchmark"
          market_multiple: "Benchmark multiple"
          prior_median: "Prior corridor median"
          history_multiple: "Prior-median multiple"
          quality: "Data quality"
        table:
          year: "Year"
          implied_uv: "Implied unit value (USD/t)"
          benchmark: "WB benchmark (USD/t)"
          market_multiple: "Benchmark multiple"
          prior_median: "Prior corridor median (USD/t)"
          history_multiple: "Prior-median multiple"
      peers:
        title: "How unusual was the case among comparable corridors?"
        takeaway: "This observation sits at or above {percentile} of {peers} same-product corridors in {year}."
        takeaway_unavailable: "Peer position is unavailable — the selected case has no computable unit-value-to-benchmark multiple among its product-family peers for this year."
        population_note: "Peers are all other corridors — exporter→importer routes shipping the same product family ({family}) in {year} — each measured on the same unit-value-to-benchmark basis. For example, a different {family} route (another exporter→importer pair) counts as a peer, while a route in a different commodity does not. That gives {peers} peer corridors in {year}, including this case."
        outside_note: "{n} peer(s) with multiples outside the 0.01×–100× display range are not drawn in the histogram; they remain in the percentile calculation."
        x_title: "Implied unit value ÷ WB benchmark"
        y_title: "Peer corridors"
        reference_label: "1× benchmark"
        case_label: "{multiple}× benchmark"
        bar_hover_suffix: "corridors"
        table:
          measure: "Measure"
          value: "Value"
          case_multiple: "Selected-case benchmark multiple"
          case_percentile: "Selected-case peer percentile"
          peer_count: "Total peers (same product family and year)"
          median_multiple: "Peer median multiple"
          p95_multiple: "Peer 95th-percentile multiple"
          at_or_above_3x: "Peers at or above 3× benchmark"
    why:
      heading: "Why this observation ranked highly"
      # Dynamic ranking summary: only the case's flagged evidence types appear.
      summary_prefix: "This observation ranked highly because "
      summary_join: ", "
      summary_final_join: " and "
      summary_suffix: "."
      summary_empty: "This observation ranked highly on the review-priority score; the strongest comparisons behind it are shown below."
      # Keyed by "<evidence_type>.<direction>" (from why_ranked_high.summary_clause_keys).
      summary_clauses:
        annual_unit_value_change.increase: "its implied unit value increased sharply"
        annual_unit_value_change.decrease: "its implied unit value fell sharply"
        benchmark_gap.above: "it stood well above the annual benchmark"
        benchmark_gap.below: "it stood well below the annual benchmark"
        history_deviation.above: "it fell far outside the corridor's prior observed range"
        history_deviation.below: "it fell far below the corridor's prior observed range"
        benchmark_adjusted_drift.increase: "its gap to the benchmark widened"
        benchmark_adjusted_drift.decrease: "its gap to the benchmark narrowed"
        value_quantity_divergence.increase: "its reported value moved faster than its quantity"
        value_quantity_divergence.decrease: "its reported quantity moved faster than its value"
      summary_note: "These are reasons to review this pattern more closely — not a finding of wrongdoing."
      # Four comparison cards (2x2). {multiple} is exp() of the log feature to 1dp;
      # {z} is the robust z-score to 1dp. Cards show the real per-case value; the
      # unavailable line shows only when the underlying feature is genuinely missing.
      cards_heading: "The evidence behind the ranking"
      how_calculated_label: "How calculated"
      how_metric_label: "Technical metric"
      how_comparison_label: "Compared with"
      how_derivation_label: "Derivation"
      how_result_label: "Result"
      cards:
        A:
          title: "Sharp implied-price movement"
          value_increase: "Implied unit value rose to {multiple}× its previous observed level"
          value_decrease: "Implied unit value fell to {multiple}× its previous observed level"
          support: "The annual implied unit value moved sharply compared with the corridor's previous active year."
          caveat: "Annual implied unit values are aggregate averages calculated from reported trade value and quantity. They are not invoice prices."
          unavailable: "Previous-year comparison unavailable"
          metric: "unit_value_yoy_change"
          comparison: "the corridor's previous observed year"
          derivation: "exp() of the year-over-year change in log implied unit value."
        B:
          title: "Gap to broad market context"
          value_increase: "Implied unit value was {multiple}× the annual benchmark"
          value_decrease: "Implied unit value was {multiple}× the annual benchmark"
          support: "The reported aggregate unit value was materially away from the World Bank annual benchmark for the same product and year."
          caveat: "The World Bank benchmark provides broad commodity-market context. It is not invoice-level fair value and does not prove mispricing."
          unavailable: "Benchmark comparison unavailable"
          metric: "benchmark_residual"
          comparison: "the same-year World Bank benchmark"
          derivation: "exp() of the log gap between the implied unit value and the annual benchmark."
        C:
          title: "Break from prior corridor behaviour"
          value_increase: "The selected year falls far outside the corridor's prior observed range"
          value_decrease: "The selected year falls far below the corridor's prior observed range"
          secondary: "{z} robust deviations {direction} the prior pattern"
          direction_above: "above"
          direction_below: "below"
          support: "The implied unit value differed substantially from the corridor's own earlier observations."
          caveat: "Short histories or very stable prior values can make this measure more sensitive. It is a comparison signal, not a finding of wrongdoing."
          unavailable: "Prior corridor comparison unavailable"
          metric: "robust_historical_z"
          comparison: "the corridor's prior-year median and spread"
          derivation: "Distance from the corridor's prior pattern in robust (median/MAD) units. Not exponentiated."
        D:
          title: "Benchmark-relative gap widened"
          value_increase: "The benchmark-relative ratio rose to {multiple}× its previous level"
          value_decrease: "The benchmark-relative ratio fell to {multiple}× its previous level"
          support: "The difference between the corridor's implied unit value and the annual benchmark changed compared with the previous observed corridor year."
          caveat: "Changes may reflect product grade, commercial terms, contract timing, freight, insurance or reporting differences."
          unavailable: "Previous benchmark-gap comparison unavailable"
          metric: "benchmark_adjusted_drift"
          comparison: "the corridor's previous benchmark residual"
          derivation: "exp() of the change in the log benchmark residual versus the previous observed corridor year."
      # Full analytical signal profile (collapsed).
      signals_heading: "Signals for this observation"
      signals_description: "The complete analytical profile supporting the selected observation. Expand this section to review each signal, its case-specific result and how it was constructed."
      signals_empty: "No analytical signals are available for this observation."
      signals_columns:
        field: "Technical field"
        label: "Display label"
        result: "Case result"
        derived: "How it is derived"
        time_safety: "Time-safety rule"
      # Value formatting for the Case result column (numeric part; joined to the
      # interpretation with an em dash by the page).
      value_multiple: "{multiple}× "
      value_percentile: "{value} percentile"
      value_zscore: "{z} robust deviations {direction} prior history"
      value_count: "{n} prior active years"
      value_flag_yes: "Yes"
      value_flag_no: "No"
      value_magnitude: "{value}"
      value_missing: "Not available"
      direction_above: "above"
      direction_below: "below"
      # Per-field: display label, purpose tooltip, case-result interpretation,
      # how-derived, and time-safety rule. Technical field names are preserved.
      signals:
        robust_historical_z:
          label: "Deviation from prior history"
          tooltip: "Measures how far the current implied unit value is from this corridor's own earlier pattern."
          interpretation: "distance from the corridor's own prior observed range."
          derived: "Current implied unit value compared with the median of prior corridor years, scaled by the corridor's prior variation."
          time_safety: "Prior years only"
        benchmark_residual:
          label: "Distance from annual benchmark"
          tooltip: "Shows how far the implied unit value sits from the broad World Bank commodity benchmark for the same product and year."
          interpretation: "the implied unit value against broad annual market context."
          derived: "Gap between the log implied unit value and the same-year World Bank benchmark, shown here as a multiple."
          time_safety: "Current-year benchmark only"
        benchmark_adjusted_drift:
          label: "Change in benchmark gap"
          tooltip: "Shows whether the corridor's gap to the benchmark widened or narrowed versus its previous observed year."
          interpretation: "the change in the corridor's gap to the benchmark."
          derived: "Change in the benchmark residual from the previous observed corridor year."
          time_safety: "Previous observation only"
        same_family_year_peer_percentile:
          label: "Position among same-product peers"
          tooltip: "Shows where this observation sits among corridors trading the same product in the same year."
          interpretation: "this observation among comparable same-product corridors in the same year."
          derived: "Percentile position of the benchmark residual among observations for the same product and year."
          time_safety: "Same-year peers only; no future years"
        unit_value_yoy_change:
          label: "Change in implied unit value"
          tooltip: "Shows how much the implied unit value changed since the corridor's previous active year."
          interpretation: "the change in implied unit value from the previous active corridor year."
          derived: "Change from the previous observed year for the same exporter–importer–product corridor."
          time_safety: "Previous observation only"
        trade_value_yoy_change:
          label: "Change in trade value"
          tooltip: "Shows how much reported annual trade value changed since the previous active year."
          interpretation: "the change in reported annual trade value."
          derived: "Change in reported trade value from the previous observed corridor year."
          time_safety: "Previous observation only"
        quantity_yoy_change:
          label: "Change in quantity"
          tooltip: "Shows how much reported physical quantity changed since the previous active year."
          interpretation: "the change in reported physical quantity."
          derived: "Change in reported quantity from the previous observed corridor year."
          time_safety: "Previous observation only"
        value_quantity_divergence:
          label: "Value versus quantity movement"
          tooltip: "Shows whether reported value moved faster than reported quantity."
          interpretation: "how far reported value moved relative to reported quantity."
          derived: "Difference between the value change and the quantity change over the same period."
          time_safety: "Previous observation only"
        corridor_activity_history:
          label: "Prior active-year history"
          tooltip: "How many earlier years this corridor–product appeared in the observed panel."
          interpretation: "the number of earlier observed years supporting the comparison."
          derived: "Count of prior active years for the same exporter–importer–product corridor."
          time_safety: "Prior activity history only"
        corridor_novelty_flag:
          label: "New corridor indicator"
          tooltip: "Whether this corridor–product has no earlier active year in the observed panel."
          interpretation: "whether this corridor had no earlier active year in the observed period."
          derived: "Set when the corridor has no prior active year in the observed panel."
          time_safety: "Prior activity only"
        corridor_reactivation_flag:
          label: "Reactivated corridor indicator"
          tooltip: "Whether the corridor–product traded, stopped, and reappeared."
          interpretation: "whether the corridor stopped and reappeared after a gap."
          derived: "Set when prior activity exists but the previous active year is not the immediately preceding year."
          time_safety: "Prior activity pattern only"
        benchmark_consistency_gap:
          label: "Difference from wider benchmark movement"
          tooltip: "Whether the corridor moved differently from the wider commodity market. Near zero means the move is explained by the market."
          interpretation: "how differently the corridor moved from the wider market (near zero = market-explained)."
          derived: "Compares this row's year-over-year change with the same year's benchmark change."
          time_safety: "Current-year benchmark change only"
    limitations:
      case_heading: "Case-specific caveats"
      case_intro: "Things to keep in mind when reading this particular observation."
      project_heading: "Project-wide limitations"
      project_intro: "Boundaries that apply to the whole approach and its public data."
      no_caveats: "No case-specific caveats were recorded for this observation."
      closing_suffix: "Human review remains necessary before any conclusion."
  portfolio_analytics:
    eyebrow: "Stakeholder analytics"
    title: "Trade Landscape and Patterns"
    subtitle: ""
    # Skimmable objective, stated plainly at the top of the page.
    objective: "This page builds the context for the review queue. First, see how much trade each commodity carries. Next, see how world benchmark prices moved. Finally, see when and where the Top 50 review candidates appear. This separates ordinary market scale and price movement from patterns elevated for human review."
    # Context strip. Every figure is derived live from the official panel.
    strip:
      value_label: "Trade value covered"
      value_detail: "{years}, official annual aggregates"
      dominant_label: "{family} share of value"
      dominant_detail: "One family dominates, so read each family on its own"
      families_label: "Product families"
      families_detail: "Gold, copper, palm oil"
      corridors_label: "Trading corridors"
      corridors_detail: "Exporter–importer routes across the window"
    scale:
      heading: "Scale: where the money is"
