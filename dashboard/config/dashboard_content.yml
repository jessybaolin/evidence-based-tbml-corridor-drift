          - "Regional and market relevance"
          - "Public benchmark availability"
          - "Analytical feasibility"
        statement: "The product mix is intentionally diverse: gold tests sensitivity, while copper and palm oil test whether the method remains disciplined on more routine trade."
    scene2:
      heading: "How official records become comparable analytical observations"
      stages:
        - title: "Verify sources"
          body: "Confirm source version, file integrity, coverage period, expected fields and product codes."
        - title: "Standardise units and codes"
          body: "Convert reported values into consistent units and map country and product codes to readable names."
        - title: "Build one clean annual row"
          body: "Combine records into one traceable exporter–importer–product observation for each year."
        - title: "Apply usability controls"
          body: "Keep every row; mark which rows can support implied unit-value analysis."
        - title: "Create time-safe analytical signals"
          body: "Describe each observation using only information available at that point in time."
      verify_panel:
        file_label: "CEPII BACI extract · release {release}"
        badge: "Verified"
        body: "Version, integrity hash, row counts, coverage period, expected fields and product codes are all checked before any analysis runs."
        provenance_cta: "View provenance"
        provenance_note: "Recorded by the source-verification stage. Hashes let anyone confirm the exact files behind every number on this dashboard."
      standardise_panel:
        examples:
          - "Trade value: thousand USD → USD"
          - "Quantity: metric tons"
          - "Gold benchmark: troy ounce → metric ton"
      row_panel:
        raw_labels:
          - "BACI trade record"
          - "Country & product names"
          - "Same-year benchmark"
        clean_label: "One clean annual row"
        caption: "Source identity and data version remain linked to every observation."
      controls_panel:
        body: "Rows without a valid reported quantity cannot support implied unit-value analysis — an implied price needs both value and quantity. They are excluded from modelling but retained for audit, never silently removed."
        note: "A missing quantity is a data limitation, not a suspicion signal."
        funnel_total: "{total} official observations"
        funnel_eligible: "{eligible} eligible for scoring"
        funnel_value: "Eligible rows represent {value_share}% of covered trade value."
        eligibility_term: "Eligibility"
        tip: "Eligibility means suitable for this analytical comparison—not guaranteed correctness at source."
      timesafe_panel:
        definition: "Time-safe features compare each observation only with information that would have been available at that point in time. Future years are never used to define what was normal in an earlier year."
        chips:
          - name: "Own history"
            question: "Is this route different from how it behaved before?"
          - name: "Same-year peers"
            question: "Is it unusual relative to other corridors trading the same product that year?"
          - name: "Market benchmark"
            question: "Did it move differently from the wider commodity market?"
          - name: "Value versus quantity"
            question: "Did reported value change faster than physical volume?"
          - name: "Corridor status"
            question: "Is the route new or returning after a gap?"
        year_heading: "Scoring the {focus_year} observation"
        year_compare_label: "compare"
        year_hidden_label: "hidden"
        year_caption: "Years {history_span} inform what was normal; {focus_year} is the observation under comparison; {hidden_span} remain hidden."
    scene3:
      heading: "Two data paths—with a strict wall between them"
      top_node: "Clean official panel"
      wall_label: "Evaluation boundary"
      official:
        kicker: "Official analysis lane"
        sub: "Real official observations"
        steps:
          - "Clean official panel"
          - "Time-safe features"
          - "Selected model"
          - "Top-{queue_size} review queue"
      evaluation:
        kicker: "Model evaluation copy"
        label: "Controlled evaluation copy—not official findings"
        steps:
          - "Copy of the clean panel"
          - "Inject controlled review patterns and benign look-alikes"
          - "Chronological train ({train_span}) / validation ({validation_span}) / test ({test_span})"
          - "Compare and select the ranking method"
        return_note: "Only the selected method returns. Synthetic rows never cross."
      supporting: "Public trade data contains no confirmed TBML labels. Controlled scenarios are therefore used to test whether a model recognises intended patterns and avoids unusual-but-benign examples. They are never presented as real cases."
      resolution:
        model_chip: "Selected model"
        model_detail: "{selected_method}"
        applied: "Applied to official observations only"
        queue: "Official top-{queue_size} queue"
      output:
        heading: "From ranking to reviewable case"
        step_case: "Top-ranked official observation"
        step_evidence: "{evidence_per_case} recomputable evidence rows"
        evidence_tip: "A recomputable evidence row records the observed metric, comparison, threshold, source reference and caveat."
        step_brief: "Caveated analyst brief"
        step_review: "Human review"
        examples_intro: "Evidence checks drawn from"
      fatf:
        heading: "Two inputs, one brief — kept separate"
        input_evidence: "Recomputable data evidence"
        input_context: "FATF–Egmont context cards"
        output_node: "Analyst brief"
        note: "Typology context is never one of the evidence rows."
        brief_structure_intro: "Each brief covers"
        brief_structure:
          - "Why this pattern ranked highly"
          - "Possible benign explanations"
          - "Information unavailable in public data"
          - "Recommended human-review questions"
          - "Conclusion boundary"
        layers:
          - ["Evidence rows", "Explain the quantitative ranking"]
          - ["FATF–Egmont context", "Supports caveats and review framing"]
          - ["Analyst brief", "Organises the evidence and identifies next checks"]
          - ["Human analyst", "Investigates and decides"]
        render_note: "Brief text lives in the pipeline outputs; the dashboard describes this structure and never renders brief text."
    closing:
      statement: "The analysis is built from verified public trade and benchmark data at a clearly defined annual grain. The data is standardised, filtered for analytical usability and transformed using time-safe comparisons. Controlled synthetic scenarios are kept separate and used only to test the model; the final queue contains real official observations supported by recomputable evidence and caveated human-review guidance."
      reminder: "Annual public aggregates—not invoices, customers or bank exposure."
    companion:
      cta: "Open technical companion"
      intro: "Detailed pipeline diagrams, raw source field names and cryptographic provenance — everything needed to verify the story above."
      figures_heading: "Pipeline diagrams"
      fields_heading: "Raw BACI field names"
      fields_note: "The dashboard shows readable names; these are the underlying source fields."
      provenance_heading: "Source checksums (SHA-256)"
  model_and_controls:
    eyebrow: "Methodology"
    title: "Model Evaluation & Controls"
    subtitle: "How the ranking was evaluated, selected, controlled, and caveated."
    scenario_note: >
      Model comparison uses controlled synthetic review-priority scenarios and
      hard negatives injected into a copy of the panel. Scenario labels are
      evaluation constructs, not confirmed TBML labels. The selected blend is
      then applied to the real official observations to build the review queue.
  bank_implementation_pathway:
    eyebrow: "Future-state design"
    title: "Bank Implementation Pathway"
    subtitle: "How this public-data triage prototype could support wholesale-banking AFC reviews when joined with governed bank records."
    boundary:
      label: "Future-state boundary"
      body: "Future-state design only. Private bank-data integration, case-management connectivity, and production decisioning have not been built."
    role:
      heading: "Where the prototype could fit"
      body: >-
        Inside a wholesale bank, the current review queue could sit at the
        front of the review funnel as an external-intelligence layer. It could
        add corridor and commodity context before an analyst examines
        customers, transactions, documents and physical-trade records.
      body_2: >-
        It would not replace transaction monitoring, sanctions screening,
        case management or human investigation. The proposed extension is a
        controlled joining exercise: retain the public-data analytical core,
        then add bank-governed evidence around each prioritised pattern.
    architecture:
      heading: "From public-data prototype to a bank review workflow"
      caption: "The analytical core remains an external signal; bank records and human judgement make a case decidable."
      today:
        kicker: "Today"
        title: "Public-data prototype"
        nodes:
          - title: "Official trade data and benchmarks"
            detail: "Annual corridor-product observations with broad market context."
          - title: "Review-priority queue"
            detail: "Unusual patterns ordered for human attention."
          - title: "Evidence and analyst briefs"
            detail: "Recomputable facts, caveats and suggested review questions."
      bridge: "Extend with governed bank context"
      future:
        kicker: "Future"
        title: "Bank-integrated design"
        nodes:
          - title: "External-intelligence layer"
            detail: "This project's queue and evidence enter the bank workflow."
          - title: "Bank-governed enrichment"
            detail: "Approved customer, document, shipment and payment context is joined."
          - title: "Case management and human review"
            detail: "An accountable analyst investigates, records a disposition and decides next steps."
          - title: "Governed feedback dataset"
            detail: "Structured outcomes may support evaluation and calibration after quality and bias controls."
      feedback_note: "Analyst dispositions are not unquestioned ground-truth labels. Coverage, reviewer consistency and selective-label bias must be assessed before they are used for model evaluation or calibration."
    data_domains:
      heading: "What a bank would add"
      caption: "These records are structurally absent from the public-data prototype and remain subject to bank ownership, access and retention controls."
      items:
        - title: "KYC/CDD and expected activity"
          detail: "Customer identity, risk profile, expected trade activity and relationship context."
          icon: "landmark"
        - title: "Trade-finance documentation"
          detail: "Contracts, invoices, instrument terms, Incoterms and goods descriptions."
          icon: "file-search"
        - title: "Shipment and customs records"
          detail: "Bills of lading, customs declarations and evidence of physical movement."
          icon: "package"
        - title: "Payments and correspondent data"
          detail: "Originators, beneficiaries, intermediaries, timing, currencies and amounts."
          icon: "line-chart"
        - title: "Sanctions and adverse media"
          detail: "Existing screening results and investigative context, governed separately from the ranking signal."
          icon: "search"
        - title: "Beneficial ownership"
          detail: "The natural persons who ultimately own or control the trading parties."
          icon: "shield-check"
    value:
      heading: "Potential value to wholesale-banking AFC"
      caption: "Proposed benefits to test in a controlled pilot, not measured production outcomes."
      items:
        - title: "Better-scoped triage"
          detail: "Use corridor, product and market context to focus limited analyst attention."
          icon: "checklist"
        - title: "Contextual review"
          detail: "Test a public aggregate anomaly against the customer profile, documents, payments and physical trade."
          icon: "layers"
        - title: "Traceable rationale"
          detail: "Carry recomputable evidence, caveats and missing-information questions into the review record."
          icon: "file-text"
        - title: "Governed learning loop"
          detail: "Use quality-controlled review outcomes to evaluate ranking performance and revisit calibration."
          icon: "rotate-cw"
    adoption:
      heading: "A controlled adoption pathway"
      caption: "Each stage adds evidence and governance before operational reliance increases."
      stages:
        - number: "1"
          title: "Offline enrichment pilot"
          detail: "Join a limited sample of queued patterns to approved internal records in a segregated environment. No automated decisions or customer action."
        - number: "2"
          title: "Controlled workflow integration"
          detail: "Send evidence packages to case management, capture structured analyst questions and dispositions, and preserve end-to-end lineage."
        - number: "3"
          title: "Validated operational use"
          detail: "Proceed only after independent validation, access-control approval, monitoring design and performance review on fresh periods."
    controls:
      heading: "Controls required before operational use"
      items:
        - title: "Private-data governance"
          detail: "Purpose limitation, entitlements, retention, lineage and audit logging for every internal record used."
        - title: "Model risk and monitoring"
          detail: "Independent validation, periodic re-evaluation, drift monitoring and documented change control."
        - title: "Feedback-label governance"
          detail: "Disposition definitions, reviewer consistency, missing outcomes and selective-label bias must be tested."
        - title: "Human accountability"
          detail: "A named analyst remains responsible for every review decision; the score never establishes suspicion or criminal intent."
    closing:
      statement: "The credible extension is the operating discipline: prioritise unusual patterns, expose recomputable evidence, state the caveats, join the private records a bank already governs, and leave every conclusion to accountable human review."
      chips: ["External intelligence", "Governed enrichment", "Human decision"]
    design_basis: "Design basis: references/DOMAIN_GUIDE.md · references/evidence_first_tbml_project_explainer.md · references/feature_typology_crosswalk.md · supplied project brief section 10"
  appendix:
    eyebrow: "Appendix"
    title: "Data Dictionary"
    subtitle: "Definitions, analytical fields, and official data sources."

