  model_and_controls:
    eyebrow: "Methodology"
    title: "Model Evaluation & Controls"
    subtitle: ""
    objective: "This page shows how the Top 50 ranking is tested, whether it works, why the blended method was selected and how its use is controlled."
    # Top-of-page pipeline overview: the four steps from official records to queue.
    queue_build:
      heading: "How the ranking queue is built"
      caption: "From official trade records to the Top-50 review queue, in four steps."
      steps:
        - title: "Clean official records"
          detail: "Verified public trade data — one row per corridor, product and year."
        - title: "Time-safe features"
          detail: "Each row uses current-year market and peer context plus earlier route history; future years are never used."
        - title: "Ranking score"
          detail: "{blend} scores each record with usable value and quantity."
        - title: "Top-{queue_size} review queue"
          detail: "The highest-scoring official records become the queue."
    tested:
      heading: "How the ranking is tested"
      body: >
        Public trade data has no confirmed cases to learn from, so the method is
        tested on patterns we plant ourselves. On a copy of the real data we add
        clear unusual patterns it should catch, plus ordinary-but-large movements
        it should leave alone — then check how well it tells them apart.
      split_heading: "How to read this test"
      split_line: "The machine-learning model is fitted on {train} data, the scoring approach is selected using {validation}, and its final test is run once on {test}. This keeps the test years out of model fitting and method selection."
      caveat: "The performance figures below show how well the selected method ranks planted patterns in the held-out {test} public-data test copy. They are not real-world detection rates."
    # "Tested on a copy" visual: the planted patterns it must catch vs the benign
    # look-alikes it must leave alone (replaces the old two-lane wall diagram).
    scenarios:
      subhead: "Tested on a copy of the data"
      copy_from: "Real official records"
      copy_to: "Test copy"
      copy_note: "A copy is used — the real records that build the queue are never changed."
      catch_heading: "Planted unusual patterns — the method must catch these"
      catch_items:
        - title: "Over-valuation"
          detail: "Reported value scaled up 2–3× while quantity holds, so the unit value spikes."
        - title: "Under-valuation"
          detail: "Reported value cut to a fraction while quantity holds, so the unit value collapses."
        - title: "Low volume, high value"
          detail: "Value pushed up and quantity pulled down together — a small shipment reported as worth a lot."
      ignore_heading: "Benign look-alikes — the method must leave these alone"
      ignore_items:
        - title: "Moves with the market"
          detail: "A large move that stays in line with the same year's market benchmark."
        - title: "Value and quantity grow together"
          detail: "Both scale up in proportion, so the unit value barely changes."
      separation_note: "Only the chosen method returns to score the real records. Test rows never mix into the queue."
    works:
      heading: "How well does it rank the test patterns?"
      takeaway: "On the unseen 2023-2024 test years, {found} of the {k} highest-ranked rows were planted test patterns. A random {k}-row review would be expected to contain about {random_expected}. The selected queue is therefore {lift}x more concentrated than random selection."
      bar_x: "Share of each 50-row review queue that is a planted test pattern"
      bar_selected: "The chosen method"
      bar_rule: "Simple fixed rules"
      bar_random: "Random review (expected)"
      family_limit: "On this controlled test, the method separated planted patterns best for {best} and least well for {worst}. Family sizes and base rates differ, so this is a model-performance warning, not a statement that one commodity is riskier."
      capacity_heading: "What changes when review capacity changes?"
      capacity_body: "A shorter queue is more concentrated but misses more planted patterns. A longer queue finds more of them, but analysts must review more rows that are not planted patterns."
      capacity_precision: "Precision: planted share of queue"
      capacity_recall: "Recall: patterns found"
      capacity_x: "Rows reviewed"
      capacity_y: "Share (%)"
      capacity_caption: "At the current Top {k}, {found} of {k} reviewed rows are planted patterns ({precision}% precision), while {found} of all {positives} planted patterns are found ({recall}% recall). These are synthetic-scenario results, not real-world detection rates."
      math:
        label: "How these results are calculated"
        intro: "The calculations below use the selected method's row-level scores for the held-out 2023-2024 test years."
        facts:
          rows: "Eligible test rows"
          patterns: "Planted test patterns"
          reviewed: "Rows reviewed"
          found: "Patterns found in selected queue"
        columns:
          metric: "Metric"
          calculation: "Calculation"
          result: "Result"
          meaning: "What it means"
        metrics:
          precision: ["Precision@50", "Share of reviewed rows that are planted patterns"]
          recall: ["Recall@50", "Share of all planted patterns found in the queue"]
          random: ["Random baseline", "Expected planted-pattern share under random review"]
          lift: ["Lift over random", "How concentrated the queue is relative to random selection"]
        caveat: "Lift is a ranking-concentration measure. It is not a measure of improvement in real-world financial-crime detection."
    method:
      heading: "Why this method was chosen"
      body: >
        The final ranking combines two different views of unusual trade activity:
        a documented weighted-sum score and an XGBoost model. One applies fixed,
        inspectable weights to known review signals; the other learns combinations
        of signals from the controlled training scenarios.
      story_steps:
        - icon: "sliders"
          title: "Start with fixed weights"
          detail: "Nine review signals are put on a common 0-to-1 scale and combined using weights recorded before model testing."
        - icon: "brain"
          title: "Learn signal combinations"
          detail: "XGBoost learns which combinations best rank the planted patterns in the training years."
        - icon: "shield-check"
          title: "Choose the permitted blend"
          detail: "Three predefined blends are compared on validation years only; the test years remain unopened until the design is fixed."
      formula_heading: "The retained ranking formula"
      formula: "Ranking score  =  {challenger_pct}% × XGBoost  +  {rule_pct}% × weighted sum"
      blend_challenger_label: "{challenger_pct}% XGBoost"
      blend_rule_label: "{rule_pct}% weighted sum"
      selection_summary: >
        The 75/25 blend ranked the most planted patterns among the three permitted
        blends on the {validation_years} validation years. The {rule_pct}% is a
        formula weight, not a share of human judgement or a guarantee that the
        full model is transparent.
      weighted_sum:
        label: "How the weighted-sum score and 75/25 blend are calculated"
        intro: >
          Each signal is first converted to a value from 0 to 1. A fixed weight is
          then multiplied by that value. For example, a history signal at 1 can add
          up to 0.20; a history signal at 0.5 adds 0.10. The weights control how
          strongly each signal can move the score.
        formula: "Weighted-sum score = unusual-pattern evidence − market-explanation adjustment − data-reliability adjustment"
        components_heading: "Fixed weights applied to the review signals"
        columns:
          signal: "Review signal"
          weight: "Maximum addition"
          meaning: "What it captures"
        components:
          - key: "history_weight"
            signal: "Own-history deviation"
            meaning: "How far the route is from its earlier pattern"
          - key: "benchmark_residual_weight"
            signal: "Market-benchmark gap"
            meaning: "How far its implied unit value is from the broad benchmark"
          - key: "benchmark_drift_weight"
            signal: "Change after the benchmark"
            meaning: "Whether its benchmark gap changed from the previous observation"
          - key: "yoy_weight"
            signal: "Annual implied-value movement"
            meaning: "How sharply its implied unit value changed"
          - key: "divergence_weight"
            signal: "Value versus quantity"
            meaning: "Whether reported value changed differently from physical volume"
          - key: "peer_weight"
            signal: "Same-product peer position"
            meaning: "How extreme the route is among comparable routes that year"
          - key: "novelty_weight"
            signal: "New route"
            meaning: "Whether the route-product has no earlier active year"
          - key: "reactivation_weight"
            signal: "Returning route"
            meaning: "Whether the route-product returned after a gap"
          - key: "valid_extreme_weight"
            signal: "Valid extreme value"
            meaning: "Whether a usable row is far above or below its benchmark"
        reductions_heading: "Why the weighted sum can be lowered"
        reductions_intro: |
          Both adjustments are penalties in the calculation: they are subtracted from the weighted-signal subtotal, so neither can increase review priority.

          - **Market-explanation adjustment:** compares the corridor's annual implied-unit-value movement with the commodity benchmark. Matching movements subtract 0.15; the penalty declines as the movements differ and reaches zero at a 0.35 movement gap.
          - **Data-reliability adjustment:** converts the 0-to-6 quality score into a deduction using `0.08 × (6 − quality score) ÷ 6`. A 6-out-of-6 row loses nothing; each point below 6 subtracts about 0.013, up to 0.08.
        adjustments:
          - key: "market"
            icon: "line-chart"
            title: "Market-explanation adjustment"
            question: "Did the corridor move with the wider commodity market?"
            explanation: >
              The calculation compares the annual change in the corridor's implied
              unit value with the annual change in its commodity benchmark. If both
              moved by about the same proportion, the wider market may explain that
              movement, so the row receives less review-priority credit.
            effect: >
              Move together: subtract {max_value}. Move somewhat differently:
              subtract less. Move clearly differently: subtract nothing. The
              deduction reaches zero at the configured {reference} movement-gap
              cutoff.
            example: >
              Example: a weighted-signal subtotal of 0.70 becomes 0.55 after the
              full 0.15 adjustment.
          - key: "quality"
            icon: "shield-check"
            title: "Data-reliability adjustment"
            question: "How much supporting information does the row have?"
            explanation: >
              The data-quality score awards up to 6 points for a valid quantity, a
              matched benchmark, enough prior history and complete source fields.
              Fewer points mean there is less evidence behind the comparison, so
              the row is ranked more cautiously.
            effect: >
              A 6-out-of-6 row loses nothing. Each missing quality point subtracts
              about {per_point}, up to a maximum subtraction of {max_value}.
            example: >
              Example: a 3-out-of-6 quality score subtracts 0.04; a 5-out-of-6
              score subtracts about 0.013.
        clipping_note: "The nine maximum additions total 1.18, so this is a weighted sum rather than a weighted average. After both deductions, the result is limited to the 0-to-1 range; it remains a ranking score, not a likelihood."
        validation_heading: "How the blend was selected on validation"
        validation_intro: >
          Average precision selected XGBoost as the better machine-learning model across
          the full validation ranking. Precision@50 then selected the blend because
          the operational output is a 50-row review queue.
        validation_columns:
          blend: "Validation candidate"
          xgboost: "XGBoost weight"
          weighted_sum: "Weighted-sum weight"
          result: "Planted patterns in Top 50"
        validation_caveat: >
          Standalone XGBoost was retained as a benchmark but was not an eligible
          final blend under the pre-specified design. The hybrid is therefore a
          governance choice, not the highest-scoring standalone model.
      test_heading: "Held-out test: how all five methods compared"
      comparison_caption: "Share of each method's top 50 that were planted patterns in the unseen {test_years} test years. This is the final check, not how the 75/25 weight was selected."
      comparison_x: "Share of the top 50 that were planted patterns (%)"
      tradeoff: >
        Standalone XGBoost scored slightly higher on the held-out test ({xgb_pct}%
        versus {hyb_pct}% precision@50). The hybrid is retained because the project
        deliberately required an auditable weighted-sum component before the test
        was opened—not because it was the accuracy winner.
      explainability_note: >
        The 25% weighted-sum component is an auditable anchor, not a complete
        explanation of the hybrid. Interpretability also depends on model-
        contribution analysis and the recomputable evidence attached to each case.
    honest:
      heading: "What keeps it honest"
      integrity_fail_intro: "A live data check did not pass:"
      allowed_label: "The dashboard may say"
      not_allowed_label: "The dashboard may not say"
    drawer:
      label: "Technical details (for model reviewers)"
      intro: "Evaluation definitions, reconciled sample counts and selected-model details. The results describe this fixed synthetic test design; they do not estimate live detection performance."
      protocol_heading: "Evaluation protocol and scope"
      protocol_points:
        - "The XGBoost and logistic models are fitted on 2017-2020, model and blend choices use 2021-2022 only, and 2023-2024 is opened once for the final comparison."
        - "Only rows with usable positive value and quantity are scored. Planted labels remain separate from model features."
        - "Results are descriptive for this fixed scenario set. No confidence interval, probability calibration, external validation or live-bank outcome is claimed."
        - "Average precision is used for full-ranking comparison because planted patterns are rare; ROC-AUC is not reported because it can look strong even when the top review queue is weak."
      counts_heading: "Scenario rows and scoring eligibility"
      counts_columns:
        split: "Split"
        source_rows: "Rows in test copy"
        scored_rows: "Eligible rows scored"
        excluded_rows: "Not scored"
        positives: "Planted patterns scored"
        hard_negatives: "Benign look-alikes scored"
      counts_note: "The difference between rows in the test copy and eligible rows scored is the quantity/value eligibility boundary, not model rejection."
      split_label: "Evaluation split"
      family_label: "Product family"
      metrics_heading: "Full metric table"
      metric_columns:
        model: "Method"
        n: "Rows scored"
        positives: "Planted patterns"
        k: "Queue size"
        precision: "Precision@k"
        recall: "Recall@k"
        lift: "Lift"
        average_precision: "Average precision"
        hard_negative_rate: "Benign look-alike rate@k"
        ordinary_fpr: "Ordinary-negative rate@k"
      definitions_heading: "How to read the metrics"
      metric_definitions:
        - metric: "Precision@k"
          meaning: "Of the first k rows reviewed, the share that are planted patterns."
        - metric: "Recall@k"
          meaning: "Of all planted patterns in the split, the share found in the first k rows."
        - metric: "Lift"
          meaning: "Precision@k divided by the planted-pattern rate in the full split; 1x would match random review."
        - metric: "Average precision"
          meaning: "A summary of precision across the full ranking, not only the first k rows; higher is better."
        - metric: "Benign look-alike rate@k"
          meaning: "Share of all planted benign look-alikes that entered the first k rows; lower is better."
        - metric: "Ordinary-negative rate@k"
          meaning: "Share of ordinary non-pattern rows that entered the first k rows; lower is better."
      definitions_note: "The two rates ending in @k use the score at rank k as the threshold. They are evaluation diagnostics, not observed false-alert rates in a bank."
      shap_heading: "Which inputs influence XGBoost most overall (SHAP)"
      shap_caveat: "SHAP measures how strongly each input moved the XGBoost output on average across a fixed sample of 500 eligible official rows. Absolute values show magnitude, not direction or cause; they are not case evidence."
      params_heading: "Selected XGBoost settings"
      params_note: "Three small, regularised XGBoost configurations were compared on validation average precision. The selected settings below produced the highest validation value."
      params_columns:
        setting: "Setting"
        value: "Selected value"
      params_result: "Selected configuration validation average precision: {value:.3f}."
    # Hand-off to the coverage page: once the viewer knows how the queue is
    # built, the natural next question is what could not enter it.
    next_page:
      body: "Synthetic scenarios helped compare and select the scoring approach, and official observations with usable value and quantity produced the Top 50 queue. One question remains: which official gold records never reached that assessment because usable quantity was unavailable?"
      cta: "View Unscored Gold Records"
  gold_quantity_coverage:
    eyebrow: "Methodology"
    title: "The Gold Records the Queue Cannot Assess"
    subtitle: ""
    # Opening mental model: why these records sit outside the queue. Every
    # figure on this page is derived live from the official panel.
    # One combined red "coverage boundary" banner (stamp + body).
    mental_model_stamp: "Why inspect just {gap_value_share} of gold value?"
    mental_model: "These rows make up {gap_row_rate} of gold records but only {gap_value_share} of gold value. The small value share is reassuring. They still matter because missing quantity means the queue cannot calculate implied unit value or a review-priority score. This page checks whether the exclusions are isolated or repeat along the same routes. Here, a coverage blind spot means unavailable scoring; it does not indicate hidden risk or a missed case."
    # {gold_rows} etc. are derived live on the page — never typed here.
    kpis:
      row_gap:
        label: "Gold records outside scoring"
        detail: "{gap_rows} of {gold_rows} records — nearly one in six."
      value_coverage:
        label: "Gold value still assessable"
        detail: "Only {gap_value_share} of reported gold value sits outside scoring."
      repeat_routes:
        label: "Routes excluded every year"
        detail: "Present in all {n_years} years; quantity unavailable in all {n_years}."
    section1:
      heading: "Why the small value share still matters"
      body: "Gold is worth examining because the limitation is frequent by record count but small by value. {gap_rows} of {gold_rows} gold records ({gap_row_rate}) cannot receive a unit-value-based score, yet they carry only {gap_value_share} of reported gold value. The queue therefore covers {assessable_value_share} of gold value, but its record-level coverage is less complete. The comparison below shows whether gold is unusual on both measures."
      chart_rows_title: "How often is scoring unavailable?"
      chart_value_title: "How much value is outside scoring?"
      note: "The two charts answer different control questions. Row share shows how often scoring is unavailable; value share shows how much reported trade value sits outside it. Gold has the largest affected-row share, while copper has the largest affected-value share."
      takeaway: "This does not reveal a large financial exposure. It reveals a control question: why is nearly one in six gold records outside scoring when {assessable_value_share} of gold value remains covered?"
    section2:
      heading: "Is the coverage gap isolated or repeated?"
      caption: "One large omission and a recurring low-value pattern call for different checks."
      body: "Across {affected} gold corridors with at least one affected year, two findings stand out. One large record drives most of the excluded value, while {persistent} of the {full_history} corridors present in all {n_years} years are unscorable every year. The first looks like a record-level exception; the second looks like a repeatable data-coverage pattern."
      cards:
        oneoff:
          kicker: "Quantity unavailable in one year"
          title: "{route} · {year}"
          body: "This {value} record makes up {share} of excluded gold value, but only {gold_share} of all gold value. The route appears in all {active_years} years; quantity is usable in the other {other_years}. The large headline is therefore driven by one record, not a route-wide pattern."
          action: "Check this record against the source extract or mirror trade data."
        repeated:
          kicker: "Quantity unavailable every year"
          definition: "A repeated gap means the same exporter–importer route lacks usable quantity in more than one active year. Here, persistent means the route is present in all eight years and lacks usable quantity in all eight."
          title: "{count} corridors cannot be assessed in all eight years"
          body: "Of {full_history} gold corridors present in all {n_years} years, {count} have no usable quantity in any year. Together they carry only {value}: {share} of excluded gold value and {gold_share} of all gold value. Their repetition, not their financial size, makes them worth tracing as a source-data pattern."
          action: "Trace these routes through source, reporting and processing steps as a separate data-quality review."
      takeaway: "The {gap_value} headline is driven by one record, while the recurring eight-year pattern is tiny in value. That is the useful distinction: investigate the large record as an exception and the recurring routes as a data-process blind spot. Neither should enter the anomaly queue without usable quantity."
    section3:
      heading: "Where is the repeated gap concentrated?"
      caption: ""
      summary_card:
        kicker: "What the repeated routes show"
        title: "A narrow pattern that data owners can trace"
        concentration: "{nld_linked} of the {persistent} routes touch the Netherlands. {outbound} go from the Netherlands and {inbound} go to it."
        reciprocal: "Greece, Ireland and Latvia appear in both directions, so the missing quantity is repeated across the same country pairs rather than scattered randomly."
        action_label: "How to use this finding"
        action: "Start by checking source coverage, reporting conventions and processing rules for these routes. The pattern does not identify who caused the missing quantity and must not be treated as a Netherlands or country-risk signal."
        scale_label: "Financial scale"
        scale: "Together, the {persistent} routes represent about {value}, or {share} of excluded gold value. This is a recurring data-quality issue worth tracing, not a financially material exposure."
      view_label: "Choose which routes to show"
      size_guide:
        label: "Circle area = routes touching country"
        one: "1 route · 10 countries"
        two: "2 routes · Greece, Ireland, Latvia"
        twelve: "12 routes · Netherlands"
      network_note: "Arrows run from exporter to importer. Circle area is proportional to the number of connected routes: ten countries have 1, Greece, Ireland and Latvia have 2, and the Netherlands has 12. Hover for names and direction counts; drag to pan and use the chart controls to zoom or reset."
      views:
        all: "All routes ({persistent})"
        nld_outbound: "From Netherlands ({outbound})"
        nld_inbound: "To Netherlands ({inbound})"
        reciprocal: "Two-way pairs ({reciprocal_routes} routes)"
        other: "Other routes ({other})"
      guardrail: "The network shows where the public dataset repeatedly lacks quantity. It does not identify the reporting party, explain the cause or measure country risk."
      country_map_label: "Routes touching each country"
      country_map_columns:
        iso3: "Code"
        country: "Country"
        connections: "Connected routes"
      table_label: "Route details behind the network"
      table_intro: "Each row is one exporter–importer route drawn in the network. Direction group shows whether it runs from the Netherlands, to the Netherlands or outside that group. “Yes” under two-way pair means the reverse route also appears in the table. Declared value is the sum of the eight annual trade values from 2017 to 2024; it is not an invoice or transaction amount."
      relationship_labels:
        nld_outbound: "From Netherlands"
        nld_inbound: "To Netherlands"
        other: "Not Netherlands-linked"
      table_columns:
        route: "Route"
        relationship: "Direction group"
        reciprocal: "Part of a two-way pair"
        gap_value: "Declared value across 8 years (USD)"
    conclusion:
      heading: "What should stakeholders conclude?"
      caption: "The finding changes data controls, not the review queue."
      title: "Strong value coverage, with one narrow data-quality follow-up"
      body: "The main queue still assesses almost all reported gold value. The {gap_rows} excluded records should remain visible as a coverage metric, while the recurring route pattern is sent to data owners for tracing. Missing quantity should never be converted into an anomaly signal."
      actions:
        - "Keep incomplete rows outside unit-value scoring"
        - "Trace the {persistent} recurring routes"
        - "Monitor record and value coverage separately"
      cta: "Continue to Bank Implementation Pathway"
    charts:
      products:
        rows_hover: "Rows without usable quantity"
        value_hover: "Declared value without usable quantity"
      network:
        edge_nld_outbound: "Netherlands → partner"
        edge_nld_inbound: "Partner → Netherlands"
