        takeaway: "In {year}, the corridor's implied unit value was {multiple}× the annual World Bank benchmark."
        takeaway_unavailable: "A market comparison is unavailable for the selected year because the implied unit value or the benchmark cannot be computed from the official record."
        note: "The World Bank benchmark provides broad market context; it is not invoice-level fair value."
        series_corridor: "Corridor implied unit value"
        series_benchmark: "World Bank benchmark"
        y_title: "USD per metric ton"
        hover:
