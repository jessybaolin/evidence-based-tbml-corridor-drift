  model_and_controls:
    eyebrow: "Methodology"
    title: "Model Evaluation & Controls"
    subtitle: ""
    objective: "This page shows how the ranking that builds the Top-50 queue works, end to end: how it is tested, whether it works, which methods were compared and why the blended one is used, and the limits it is held to. Public trade data has no confirmed cases to learn from, so the method is measured on controlled test scenarios, chosen on years it has never seen, and held to firm limits on what it may claim."
    # Top-of-page pipeline overview: the four steps from official records to queue.
    queue_build:
      heading: "How the ranking queue is built"
      caption: "From official trade records to the Top-50 review queue, in four steps."
      steps:
        - title: "Clean official records"
          detail: "Verified public trade data — one row per corridor, product and year."
        - title: "Time-safe features"
          detail: "Each year is described using only earlier years, never the future."
        - title: "Ranking score"
          detail: "{blend} scores every record for review priority."
        - title: "Top-{queue_size} review queue"
          detail: "The highest-scoring official records become the queue."
    tested:
      heading: "How the ranking is tested"
      body: >
        Public trade data has no confirmed cases to learn from, so the method is
        tested on patterns we plant ourselves. On a copy of the real data we add
        clear unusual patterns it should catch, plus ordinary-but-large movements
        it should leave alone — then check how well it tells them apart.
      split_line: "It learns on {train}, the approach is chosen on {validation}, and it is judged once on {test}, so it never sees the years it is tested on."
      caveat: "These results measure how well the method ranks planted patterns in public data. They are not real-world detection rates."
    # "Tested on a copy" visual: the planted patterns it must catch vs the benign
    # look-alikes it must leave alone (replaces the old two-lane wall diagram).
    scenarios:
      subhead: "Tested on a copy of the data"
      copy_from: "Real official records"
      copy_to: "Test copy"
      copy_note: "A copy is used — the real records that build the queue are never changed."
      catch_heading: "Planted unusual patterns — the method must catch these"
      catch_items:
        - title: "Over-valuation"
          detail: "Reported value scaled up 2–3× while quantity holds, so the unit value spikes."
        - title: "Under-valuation"
          detail: "Reported value cut to a fraction while quantity holds, so the unit value collapses."
        - title: "Low volume, high value"
          detail: "Value pushed up and quantity pulled down together — a small shipment reported as worth a lot."
      ignore_heading: "Benign look-alikes — the method must leave these alone"
      ignore_items:
        - title: "Moves with the market"
          detail: "A large move that stays in line with the same year's market benchmark."
        - title: "Value and quantity grow together"
          detail: "Both scale up in proportion, so the unit value barely changes."
      separation_note: "Only the chosen method returns to score the real records. Test rows never mix into the queue."
    works:
      heading: "Does it work?"
      takeaway: "On the years it had never seen, the chosen method put about {selected_pct}% of the planted patterns into its top 50, roughly {lift} times better than reviewing cases at random."
      bar_x: "Share of the top 50 that were genuinely unusual patterns"
      bar_selected: "The chosen method"
      bar_rule: "Simple fixed rules"
      bar_random: "Reviewing at random"
      guardrail: "It left the benign look-alikes alone as well: none reached the top 50, so the method does not raise alarms on ordinary market swings."
      family_limit: "It is strongest on {best} and weakest on {worst} — worth remembering for a queue weighted toward {worst}."
    method:
      heading: "Why this method was chosen"
      body: >
        Five approaches were compared, from a transparent fixed-rule score to a
        learned model (XGBoost) and an unsupervised outlier detector. Each bar
        below is a method's precision on its top 50, on years it never saw.
      comparison_caption: "Share of the top 50 that were genuinely planted patterns, per method — held-out test years."
      comparison_x: "Share of the top 50 that were planted patterns (%)"
      tradeoff: >
        XGBoost alone actually scored a little higher than the blend on the
        held-out test ({xgb_pct}% vs {hyb_pct}% of the top 50 correct). The blend
        is used anyway, for two reasons that outweigh a small edge on a ranking
        people act on:
      tradeoff_reasons:
        - "The method was locked on the validation years before the test was opened — re-picking it to chase the test score would be the exact leakage the design forbids."
        - "Keeping {rule_pct}% transparent rules means every score breaks down into named, auditable signals, not a black box."
      formula_heading: "How the blended score is built"
      formula: "Ranking score  =  {challenger_pct}% × XGBoost  +  {rule_pct}% × rules"
      blend_challenger_label: "{challenger_pct}% XGBoost"
      blend_rule_label: "{rule_pct}% rules"
      score_note: "The score sets review order. A higher score means higher review priority. It is not a probability or a finding of financial crime."
    drivers:
      heading: "What makes the flagged cases different"
      takeaway: "The flagged cases are not unusual by luck on a single measure. A typical one sits near the top on all four at once: far from its own history, far from the market benchmark, high among its peers, and moving sharply year over year."
      queue_label: "A typical flagged case"
      population_label: "A typical route"
      x_title: "Where it ranks among all routes (0 = lowest, 100 = highest)"
      caption: "Shown on a shared 0-to-100 scale so the four measures line up. This describes the flagged rows; the measures are related, so one price spike can lift several at once."
    honest:
      heading: "What keeps it honest"
      integrity_fail_intro: "A live data check did not pass:"
      allowed_label: "The dashboard may say"
      not_allowed_label: "The dashboard may not say"
      boundary_note: "Scores are review-priority signals, not probabilities. Benchmarks are market context, not fair value. Typology references frame caveats; they are never evidence about a specific case."
    drawer:
      label: "Technical details (for model reviewers)"
      intro: "Full evaluation numbers and model internals. Not needed to read the page above."
      split_label: "Evaluation split"
      family_label: "Product family"
      metrics_heading: "Full metric table"
      hybrid_heading: "Blend weights tested on validation"
      splits_heading: "Scenario counts by split"
      splits_note: "Scenario identifiers and labels are stored in a separate file, never in the model inputs. The test split was scored once, after the design was frozen."
      shap_heading: "What the learned model leans on (SHAP)"
      shap_caveat: "Model-contribution context for reviewers only. It is not evidence about any case and never appears in a case view."
      params_heading: "Selected model parameters"
      coeffs_heading: "Transparent-baseline coefficients"
      sources_heading: "Source files and checksums"
  bank_implementation_pathway:
    eyebrow: "Future-state design"
    title: "Bank Implementation Pathway"
    subtitle: "How public trade signals could help wholesale-banking AFC teams focus reviews, gather the right evidence and make better-informed human decisions."
    boundary:
      label: "Future-state boundary"
      body: "Future-state design only. Private bank-data integration, case-management connectivity, and production decisioning have not been built."
    role:
      heading: "Where the prototype could fit"
      body: >-
        Today, the prototype can show which country-to-country trade patterns
        look unusual and explain the public-data signals behind them. Inside a
        wholesale bank, that queue could become an early triage input: a prompt
        to identify relevant customers and transactions, then check whether the
        activity fits the customer profile and whether the documents, movement
        of goods and payments tell a consistent story.
      body_2: >-
        It would not replace transaction monitoring, sanctions screening,
        case management or human investigation. Its role would be narrower and
        practical: add external corridor, product and market context at the
        front of the review funnel, then let bank-governed evidence and an
        accountable analyst determine what the pattern means.
      steps:
        - label: "Public signal"
          question: "What changed in the corridor, product or market pattern?"
          icon: "line-chart"
        - label: "Bank context"
          question: "Which customers, transactions and trade records could explain it?"
          icon: "layers"
        - label: "Human decision"
          question: "Does the evidence resolve the pattern or justify deeper review?"
          icon: "shield-check"
    architecture:
      heading: "From public-data prototype to a bank review workflow"
      caption: "The prototype provides an external signal. Bank records help explain what happened, and an analyst decides what to do next."
      today:
        kicker: "Today"
        title: "Public-data prototype"
        nodes:
          - title: "Official trade data and benchmarks"
            detail: "Annual country-to-country product totals, compared with broad market prices."
          - title: "Review-priority queue"
            detail: "The most unusual patterns are placed first for analyst attention."
          - title: "Evidence and analyst briefs"
            detail: "Traceable facts, caveats and the questions a reviewer should ask next."
      bridge: "Extend with governed bank context"
      future:
        kicker: "Future"
        title: "Bank-integrated design"
        nodes:
          - title: "External-intelligence layer"
            detail: "The public-data queue and its evidence enter the review workflow as external context."
          - title: "Bank-governed enrichment"
            detail: "Approved customer, document, shipment and payment records are brought together."
          - title: "Case management and human review"
            detail: "An analyst checks the evidence, records the outcome and decides the next step."
          - title: "Governed feedback dataset"
            detail: "Quality-controlled review outcomes may later help evaluate and tune the triage process."
      feedback_note: "Analyst dispositions are not unquestioned ground-truth labels. Coverage, reviewer consistency and selective-label bias must be assessed before they are used for model evaluation or calibration."
    data_domains:
      heading: "What the bank adds to make the signal reviewable"
      caption: "Public data can show that a trade pattern is unusual. These bank-held records help an investigator understand who was involved, what was agreed, whether goods moved and how payment was made."
      items:
        - title: "KYC/CDD and expected activity"
          detail: "Who is the customer, what activity is expected, and does this trade route fit the relationship?"
          icon: "landmark"
        - title: "Trade-finance documentation"
          detail: "Do contracts and invoices support the price, quantity, goods description, terms and Incoterms?"
          icon: "file-search"
        - title: "Shipment and customs records"
          detail: "Did the stated goods and quantity move as declared in shipping and customs records?"
          icon: "package"
        - title: "Payments and correspondent data"
          detail: "Who paid whom, through which banks, in what currency, amount and timing?"
          icon: "line-chart"
        - title: "Sanctions and adverse media"
          detail: "Do screened parties or connected entities require a separate sanctions or adverse-media review?"
          icon: "search"
        - title: "Beneficial ownership"
          detail: "Who ultimately owns or controls the trading parties, and are the relationships expected?"
          icon: "shield-check"
    value:
      heading: "How this could help a wholesale-banking AFC team"
      caption: "Proposed benefits to test in a controlled pilot, not measured production outcomes."
      items:
        - title: "Choose where to look first"
          detail: "Use corridor, product and market context to direct limited analyst time toward stronger patterns."
          icon: "checklist"
        - title: "Test the pattern against bank facts"
          detail: "Compare the public signal with expected customer activity, documents, payments and physical trade."
          icon: "layers"
        - title: "Start with a traceable case pack"
          detail: "Carry source-linked evidence, caveats and missing-information questions into the review record."
          icon: "file-text"
        - title: "Learn from controlled outcomes"
          detail: "Use quality-checked review outcomes to evaluate whether the queue is useful and revisit its calibration."
          icon: "rotate-cw"
    ai_extension:
      heading: "Where AI could help: prepare the case, not decide it"
      caption: "A bounded AI assistant could organise approved evidence into a faster-to-read case pack. It would not create evidence, assign criminal intent, close a case or make an escalation decision."
      steps:
        - kicker: "Grounded inputs"
          title: "Retrieve approved evidence"
          detail: "Use validated public evidence rows and only the bank records the reviewer is entitled to access."
          icon: "database"
        - kicker: "AI-assisted preparation"
          title: "Draft and connect"
          detail: "Summarise why the pattern ranked highly, cite the supporting records, surface benign explanations and list what is still missing."
          icon: "brain"
        - kicker: "Accountable review"
          title: "Verify and decide"
          detail: "The analyst checks every source, edits the case narrative and remains responsible for the next step."
          icon: "shield-check"
      uses_heading: "Practical extensions"
      uses:
        - "Evidence-grounded case summaries with source IDs"
        - "Source-backed questions across corridor and customer history"
        - "Automatic missing-information and inconsistency checklists"
      guardrail_heading: "Required AI guardrails"
      guardrails:
        - "No unsupported facts or numbers"
        - "Citations back to approved records"
        - "Schema validation and deterministic fallback"
        - "Prompt, input and output audit logs"
    adoption:
      heading: "How a bank could start safely"
      caption: "A short pathway is enough: prove the review value offline before adding workflow integration or operational reliance."
      stages:
        - number: "1"
          title: "Test offline"
          detail: "Compare a small queue sample with approved internal records. No automated decisions or customer action."
        - number: "2"
          title: "Assist the review"
          detail: "Send traceable case packs into a controlled analyst workflow and capture structured feedback."
        - number: "3"
          title: "Validate before use"
          detail: "Add operational reliance only after independent validation, access approval and monitoring on fresh data."
    controls:
      heading: "What must stay controlled"
      items:
        - title: "Private-data governance"
          detail: "Purpose limitation, entitlements, retention, lineage and audit logging for every internal record used."
        - title: "Model risk and monitoring"
          detail: "Independent validation, periodic re-evaluation, drift monitoring and documented change control."
        - title: "Feedback-label governance"
          detail: "Disposition definitions, reviewer consistency, missing outcomes and selective-label bias must be tested."
        - title: "Human accountability"
          detail: "A named analyst remains responsible for every review decision; the score never establishes suspicion or criminal intent."
    closing:
      statement: "The bank value is not a public-data score on its own. It is the combination of an external trade signal, governed customer and transaction evidence, a traceable case pack and an accountable human decision."
      chips: ["External trade context", "Bank-governed evidence", "AI-assisted preparation", "Human decision"]
    design_basis: "Design basis: references/DOMAIN_GUIDE.md | references/evidence_first_tbml_project_explainer.md | references/feature_typology_crosswalk.md | references/post-core-project-improvement.md | reports/analyst_briefs.md"
